name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # <-- pinned: `latest` turns an upstream release into a red build
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: API reference is up to date
        run: bun run docs:api --check
      # The parity suite needs the compiled probe this job does not build, so `parity.yml` runs it.
      - run: bun test packages/react-native-nitro-h3/__tests__
      # the showcase's bunfig carries the .ttf loader its theme test needs, so this runs in its own root
      - run: bun run --cwd apps/showcase test
      - name: Vendored h3 matches the pinned upstream tag
        run: bun run vendor:h3 --check
      - name: App icons match the logo
        run: bun run icons --check
      - name: Showcase icons match the logo
        run: bun run icons:showcase --check
