name: Pages

on:
  pull_request:
    paths:
      - docs/**
      - packages/react-native-nitro-h3/docs/api.md
      - img/**
      - website/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/react-native-nitro-h3/docs/api.md
      - img/**
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Deploys serialise and never cancel; a pull request's builds cancel each other on a new push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the sitemap takes each page's lastmod from its last commit in git history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # <-- pinned: `latest` turns an upstream release into a red build
      - uses: actions/setup-node@v7
        with:
          node-version: 24  # `astro` runs under Node; Bun only runs the sync script
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write  # the OIDC token GitHub Pages exchanges for a deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
