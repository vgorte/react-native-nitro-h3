<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="react-native-nitro-h3">
  <title>react-native-nitro-h3</title>
  <!--
    Seven cells of one resolution, edge to edge, bounded by the outline of the patch itself, with
    the centre cell carrying a brighter React blue so the origin cell of the grid lifts off the
    page instead of sitting level with the rest of the mark.

    The outline of seven touching hexagons of circumradius `rb` has six notches at `2 * rb` and
    twelve tips at `sqrt(7) * rb`, the circumradius of the cell those seven would be children of.
    That cell is not drawn. Pushing the outline out by 5 units and fixing the greatest radius of
    the result at 108 gives `rb` = 38.75, a centre spacing of `sqrt(3) * rb` = 67.12 and a drawn
    cell circumradius of 32.98, which makes the lines between cells and the rim around them both
    10 units wide.

    Palette: the six outer cells are light against a dark boundary, 13.5 to 1, which is what makes
    the seven-cell structure survive.

    The centre is `#219FC9`, the same hue as React's `#61DAFB` and the darkest step along it that
    is still visibly that blue rather than the teal `#087EA4` used elsewhere: 1.5 to 1 lighter than
    that teal, 5.1 to 1 against the boundary, and only 2.6 to 1 against the light cells. That last
    ratio is the weak one and it is accepted, because the 10 unit line means the centre never meets
    a light cell directly, and the ratio that governs the small sizes is the 5.1 to 1 against the
    boundary.
  -->
  <polygon points="211.28,128.00 230.65,161.56 208.39,200.12 169.64,200.12 150.26,233.68 105.74,233.68 86.36,200.12 47.61,200.12 25.35,161.56 44.72,128.00 25.35,94.44 47.61,55.88 86.36,55.88 105.74,22.32 150.26,22.32 169.64,55.88 208.39,55.88 230.65,94.44" fill="#20232A" />
  <g fill="#E8EEF4">
    <polygon points="219.11,161.56 202.62,190.12 169.64,190.12 153.15,161.56 169.64,133.00 202.62,133.00" />
    <polygon points="160.98,195.12 144.49,223.68 111.51,223.68 95.02,195.12 111.51,166.56 144.49,166.56" />
    <polygon points="102.85,161.56 86.36,190.12 53.38,190.12 36.89,161.56 53.38,133.00 86.36,133.00" />
    <polygon points="102.85,94.44 86.36,123.00 53.38,123.00 36.89,94.44 53.38,65.88 86.36,65.88" />
    <polygon points="160.98,60.88 144.49,89.44 111.51,89.44 95.02,60.88 111.51,32.32 144.49,32.32" />
    <polygon points="219.11,94.44 202.62,123.00 169.64,123.00 153.15,94.44 169.64,65.88 202.62,65.88" />
  </g>
  <polygon points="160.98,128.00 144.49,156.56 111.51,156.56 95.02,128.00 111.51,99.44 144.49,99.44" fill="#219FC9" />
</svg>
